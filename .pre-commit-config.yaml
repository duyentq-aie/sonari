exclude: ^\.claude/
# pre-merge-commit: a merge commit runs no pre-commit hook; `make setup` installs this stage too.
default_stages: [pre-commit, pre-merge-commit]
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      # The two whitespace hooks skip the vendored third-party data in services/speech/tests/data,
      # which is kept byte for byte (see its README.md): its licence file has a spare blank line
      # at the end and one line of trailing spaces.
      - id: end-of-file-fixer
        exclude: ^services/speech/tests/data/
      - id: trailing-whitespace
        exclude: ^services/speech/tests/data/
      # Fails on a line that starts with a conflict marker. Without --assume-in-merge the hook
      # does nothing unless a merge is in progress, so it would miss an ordinary commit and
      # CI's `pre-commit run --all-files`. Keep it free of files/exclude/types/stages.
      - id: check-merge-conflict
        args: [--assume-in-merge]
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.8.6
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format
  - repo: local
    hooks:
      - id: no-vietnamese-in-python
        name: reject Vietnamese characters in .py files
        entry: python scripts/check_no_vietnamese.py
        language: python
        types: [python]
        exclude: (^|/)tests/fixtures/
      - id: strip-ai-trailers
        name: strip AI co-author trailers
        entry: sed -i -e '/^Co-[Aa]uthored-[Bb]y:.*[Cc]laude/d' -e '/Generated with \[Claude Code\]/d'
        language: system
        stages: [commit-msg]
